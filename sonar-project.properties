# SonarQube Project Configuration
sonar.projectKey=biopark-classroom-management
sonar.projectName=Biopark Classroom Management
sonar.projectVersion=1.0.0

# SonarQube Server URL (use localhost for local development)
sonar.host.url=http://localhost:9000

# Source code location
sonar.sources=apps/server/src,apps/web/src

# Test files location
sonar.tests=apps/server/test,apps/web/src

# Test file patterns
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts,**/jest.config.ts,**/jest.setup.ts,**/next.config.ts,**/next-env.d.ts

# Coverage reports
sonar.javascript.lcov.reportPaths=apps/server/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts,**/jest.config.ts,**/jest.setup.ts,**/main.ts,**/app.bootstrap.ts

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# TypeScript specific
sonar.typescript.tsconfigPath=tsconfig.base.json
